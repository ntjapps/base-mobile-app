name: Apps Android Build

# Manual only: start it from the Actions tab or `gh workflow run`.
# Not triggered on push/PR because CI minutes cost money.
on:
  workflow_dispatch:
    inputs:
      config:
        description: Environment (flavor and config/<config>.json)
        type: choice
        options: [prod, dev]
        default: prod

permissions:
  contents: read

jobs:
  build-apps:
    permissions:
      contents: read
    uses: ./.github/workflows/android-common.yaml
    with:
      build_apk: true
      build_aab: true
      config: ${{ inputs.config }}
    secrets:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

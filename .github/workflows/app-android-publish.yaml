name: Apps Android Release

# Builds the signed release appbundle.
# Play Console uploads are manual via the web (the service-account publish was retired):
# download the appbundle artifact from this run and upload it in Play Console.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build-prod:
    uses: ./.github/workflows/android-common.yaml
    with:
      build_apk: false
      build_aab: true
      config: 'prod'
    secrets:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

  build-dev:
    uses: ./.github/workflows/android-common.yaml
    with:
      build_apk: false
      build_aab: true
      config: 'dev'
    secrets:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

# Reusable workflow for Android build steps
name: Android Build Common

on:
  workflow_call:
    inputs:
      build_apk:
        required: false
        type: boolean
        default: true
      build_aab:
        required: false
        type: boolean
        default: true
      # Environment: used as the Gradle flavor and as the dart-define file
      # (config/<config>.json). One of prod, dev, local.
      config:
        required: false
        type: string
        default: 'prod'
    secrets:
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false

# Reusable workflow: the caller's permissions cap these; builds only read the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@adb607ae976a9e00473569facfc69813c637a060 # v4.3
        with:
          channel: 'stable'
          version: 'latest'
          cache: true
          cache-sdk: true
      - name: Cache pub dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - name: Install dependencies
        run: flutter pub get
      - name: Extract pubspec version
        id: pubspec
        run: |
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Compose build number
        id: build_number
        run: |
          # Offset: 0 for base_mobile_app (no prior manual build numbers to honour)
          BUILD_NUMBER=$(( ${{ github.run_number }} + 0 ))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "::notice::Android build number: $BUILD_NUMBER (run_number=${{ github.run_number }}, offset=0)"
      - name: Check keystore
        id: check_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "has_keystore=false" >> $GITHUB_OUTPUT
            echo "::notice::KEYSTORE_BASE64 not set — skipping ${{ inputs.config }} build"
          else
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          fi
      - name: Decode Keystore
        if: steps.check_keystore.outputs.has_keystore == 'true' && (inputs.build_apk || inputs.build_aab)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$RUNNER_TEMP/keystore.jks"
          } > android/key.properties
      - name: Debug Active JDK and Keystore Access
        if: steps.check_keystore.outputs.has_keystore == 'true'
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_PATH: ${{ runner.temp }}/keystore.jks
        run: |
          echo "--- Debugging Environment ---"
          echo "KEYSTORE_PATH: $KEYSTORE_PATH"
          echo "--- Java Version (JAVA_HOME) ---"
          echo "JAVA_HOME: $JAVA_HOME"
          $JAVA_HOME/bin/java -version
          echo "--- Java Version (System PATH) ---"
          which java
          java -version
          echo "--- Gradle's Java Home (if set in gradle.properties) ---"
          grep 'org.gradle.java.home' gradle.properties || echo "org.gradle.java.home not found in gradle.properties"
          echo "--- Attempting to list keystore with current JAVA_HOME's keytool ---"
          $JAVA_HOME/bin/keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -storetype JKS
          if [ $? -ne 0 ]; then
            echo "ERROR: keytool command failed with the Java version at $JAVA_HOME"
            exit 1
          else
            echo "SUCCESS: keytool command executed successfully with the Java version at $JAVA_HOME"
          fi
      - name: Build appbundle
        if: steps.check_keystore.outputs.has_keystore == 'true' && inputs.build_aab
        run: |
          flutter build appbundle --flavor ${{ inputs.config }} \
            --dart-define-from-file=config/${{ inputs.config }}.json \
            --build-number=$BUILD_NUMBER \
            --dart-define=APP_VERSION=${{ steps.pubspec.outputs.version }}
      - name: Build apk
        if: steps.check_keystore.outputs.has_keystore == 'true' && inputs.build_apk
        run: |
          flutter build apk --flavor ${{ inputs.config }} --split-per-abi \
            --dart-define-from-file=config/${{ inputs.config }}.json \
            --build-number=$BUILD_NUMBER \
            --dart-define=APP_VERSION=${{ steps.pubspec.outputs.version }}
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/keystore.jks" android/key.properties
      - name: Upload appbundle
        if: steps.check_keystore.outputs.has_keystore == 'true' && inputs.build_aab
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appbundle-${{ inputs.config }}
          path: build/app/outputs/bundle/${{ inputs.config }}Release/*.aab
          retention-days: 1
      - name: Upload apk
        if: steps.check_keystore.outputs.has_keystore == 'true' && inputs.build_apk
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk-${{ inputs.config }}
          path: build/app/outputs/apk/${{ inputs.config }}/release/*.apk
          retention-days: 1

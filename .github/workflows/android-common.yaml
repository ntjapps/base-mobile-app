# Reusable workflow for Android build steps
name: Android Build Common

on:
  workflow_call:
    inputs:
      build_apk:
        required: false
        type: boolean
        default: true
      build_aab:
        required: false
        type: boolean
        default: true
      env_name:
        required: false
        type: string
        default: 'production'
      # Optional per-flavor endpoint override. Pass via repo Variables
      # (Settings → Variables → Actions) so URLs can be rotated without
      # touching code. When blank, the in-app preset for the env is used.
      api_host:
        required: false
        type: string
        default: ''
    secrets:
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: 'stable'
          version: 'latest'
          cache: true
          cache-sdk: true
      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - name: Install dependencies
        run: flutter pub get
      - name: Extract pubspec version
        id: pubspec
        run: |
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Compose build number
        id: build_number
        run: |
          # Offset: 0 for base_mobile_app (no prior manual build numbers to honour)
          BUILD_NUMBER=$(( ${{ github.run_number }} + 0 ))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "::notice::Android build number: $BUILD_NUMBER (run_number=${{ github.run_number }}, offset=0)"
      - name: Check keystore
        id: check_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "has_keystore=false" >> $GITHUB_OUTPUT
            echo "::notice::KEYSTORE_BASE64 not set — skipping ${{ inputs.env_name }} build"
          else
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          fi
      - name: Decode Keystore
        if: steps.check_keystore.outputs.has_keystore == 'true' && (inputs.build_apk || inputs.build_aab)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore.jks
          echo "storePassword=$KEYSTORE_PASSWORD" > android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "storeFile=$(realpath android/keystore.jks)" >> android/key.properties
      - name: Debug Active JDK and Keystore Access
        if: steps.check_keystore.outputs.has_keystore == 'true'
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "--- Debugging Environment ---"
          export KEYSTORE_PATH=$(realpath keystore.jks)
          echo "KEYSTORE_PATH: $KEYSTORE_PATH"
          echo "--- Java Version (JAVA_HOME) ---"
          echo "JAVA_HOME: $JAVA_HOME"
          $JAVA_HOME/bin/java -version
          echo "--- Java Version (System PATH) ---"
          which java
          java -version
          echo "--- Gradle's Java Home (if set in gradle.properties) ---"
          grep 'org.gradle.java.home' gradle.properties || echo "org.gradle.java.home not found in gradle.properties"
          echo "--- Attempting to list keystore with current JAVA_HOME's keytool ---"
          $JAVA_HOME/bin/keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -storetype JKS
          if [ $? -ne 0 ]; then
            echo "ERROR: keytool command failed with the Java version at $JAVA_HOME"
            exit 1
          else
            echo "SUCCESS: keytool command executed successfully with the Java version at $JAVA_HOME"
          fi
      - name: Setup CMake
        uses: lukka/get-cmake@latest
      - name: Compose optional dart-define overrides
        id: overrides
        run: |
          extra=""
          if [ -n "${{ inputs.api_host }}" ]; then
            extra="$extra --dart-define=APP_API_HOST=${{ inputs.api_host }}"
          fi
          echo "extra=$extra" >> "$GITHUB_OUTPUT"
          if [ -n "$extra" ]; then
            echo "::notice::Applying endpoint overrides for ${{ inputs.env_name }}:$extra"
          fi
      - name: Build appbundle
        if: steps.check_keystore.outputs.has_keystore == 'true' && inputs.build_aab
        run: |
          flutter build appbundle --flavor ${{ inputs.env_name }} \
            --build-number=$BUILD_NUMBER \
            --dart-define=APP_ENV=${{ inputs.env_name }} \
            --dart-define=APP_VERSION=${{ steps.pubspec.outputs.version }} \
            ${{ steps.overrides.outputs.extra }}
      - name: Build apk
        if: steps.check_keystore.outputs.has_keystore == 'true' && inputs.build_apk
        run: |
          flutter build apk --flavor ${{ inputs.env_name }} --split-per-abi \
            --build-number=$BUILD_NUMBER \
            --dart-define=APP_ENV=${{ inputs.env_name }} \
            --dart-define=APP_VERSION=${{ steps.pubspec.outputs.version }} \
            ${{ steps.overrides.outputs.extra }}
      - name: Upload appbundle
        if: steps.check_keystore.outputs.has_keystore == 'true' && inputs.build_aab
        uses: actions/upload-artifact@v4
        with:
          name: appbundle-${{ inputs.env_name }}
          path: build/app/outputs/bundle/${{ inputs.env_name }}Release/*.aab
          retention-days: 1
      - name: Upload apk
        if: steps.check_keystore.outputs.has_keystore == 'true' && inputs.build_apk
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.env_name }}
          path: build/app/outputs/apk/${{ inputs.env_name }}/release/*.apk
          retention-days: 1

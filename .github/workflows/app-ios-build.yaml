name: App iOS Build

# Unsigned build to check the app compiles with the Xcode 26 / iOS 26 SDK
# that App Store Connect requires. No signing or upload.
on:
  push:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: 'stable'
          version: 'latest'
          cache: true
          cache-sdk: true
      - name: Install dependencies
        run: flutter pub get
      - name: Toolchain versions
        run: |
          xcodebuild -version
          flutter --version
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

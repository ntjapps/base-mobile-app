name: App iOS Build

# Unsigned build to check the app compiles with the Xcode 26 / iOS 26 SDK
# that App Store Connect requires. No signing or upload.
# Manual-only: macOS runner minutes are expensive, so never trigger on push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@adb607ae976a9e00473569facfc69813c637a060 # v4.3
        with:
          channel: 'stable'
          version: 'latest'
          cache: true
          cache-sdk: true
      - name: Install dependencies
        run: flutter pub get
      - name: Toolchain versions
        run: |
          xcodebuild -version
          flutter --version
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign --dart-define-from-file=config/prod.json
